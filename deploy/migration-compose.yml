# Staging merges the effective source container healthcheck (including Python
# images). Ordinary CI deploys replace this with compose.yml after validation.
services:
  dwman:
    image: ${IMAGE_REF:?Migration requires an immutable image reference}
    container_name: dwman-${ENVIRONMENT_NAME}
    ports:
      - 127.0.0.1:${PORT}:8000
    restart: unless-stopped
    environment:
      SPOTIPY_CLIENT_ID: ${SPOTIPY_CLIENT_ID}
      SPOTIPY_CLIENT_SECRET: ${SPOTIPY_CLIENT_SECRET}
      SPOTIPY_REDIRECT_URL: ${SPOTIPY_REDIRECT_URL}
      API_LOGIN: ${API_LOGIN}
      API_PASSWORD: ${API_PASSWORD}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      IGNORE_CORS: ${IGNORE_CORS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEPLOY_URL: ${DEPLOY_URL}
    volumes:
      - ./data:/app/data:rw
    labels:
      org.opencontainers.group: logging
    deploy:
      resources:
        limits:
          memory: 100M
        reservations:
          memory: 50M
