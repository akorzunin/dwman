services:
  dwman:
    image: akorzunin/dwman:${IMAGE_TAG}
    container_name: dwman-test
    ports:
      - ${PORT:-8000}:8000
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      org.opencontainers.group: "logging"
