- name: Deploy dwman to test
  hosts: all
  become: false
  vars:
    project_dir: "/srv/deploy/dwman-{{ ENVIRONMENT_NAME }}"

  tasks:
    - name: Create deploy dir
      become: true
      ansible.builtin.file:
        path: "{{ project_dir }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        state: directory
        mode: "0755"

    - name: Copy files for deploy
      ansible.builtin.copy:
        src: compose.yml
        dest: "{{ project_dir }}"
        mode: "0644"

    - name: Persist deployment settings for subsequent Compose operations
      ansible.builtin.copy:
        dest: "{{ project_dir }}/.env"
        mode: "0600"
        content: |
          IMAGE_TAG={{ IMAGE_TAG | to_json | replace('$', '$$') }}
          ENVIRONMENT_NAME={{ ENVIRONMENT_NAME | to_json }}
          SPOTIPY_CLIENT_ID={{ SPOTIPY_CLIENT_ID | to_json | replace('$', '$$') }}
          SPOTIPY_CLIENT_SECRET={{ SPOTIPY_CLIENT_SECRET | to_json | replace('$', '$$') }}
          SPOTIPY_REDIRECT_URL={{ SPOTIPY_REDIRECT_URL | to_json }}
          API_LOGIN={{ API_LOGIN | to_json | replace('$', '$$') }}
          API_PASSWORD={{ API_PASSWORD | to_json | replace('$', '$$') }}
          PORT={{ PORT | string | to_json }}
          TG_BOT_TOKEN={{ TG_BOT_TOKEN | to_json | replace('$', '$$') }}
          IGNORE_CORS={{ IGNORE_CORS | default('') | string | to_json }}
          DEPLOY_URL={{ DEPLOY_URL | to_json }}
      no_log: true

    - name: "Deploy dwman-{{ ENVIRONMENT_NAME }}"
      ansible.builtin.command:
        cmd: docker compose up -d --wait --wait-timeout 120
        chdir: "{{ project_dir }}"
      register: out
      changed_when: true
      no_log: true

    - name: Remove old version of image
      ansible.builtin.command:
        cmd: docker image prune --filter="dangling=true" --force
      register: out
      changed_when: out.rc != 0
