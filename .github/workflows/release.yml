name: release-workflow

on:
  push:
    tags:
      - "v*"

jobs:
  deploy-prod:
    runs-on: ubuntu-22.04
    environment:
      name: prod
      url: https://dwman.akorz-sw1.duckdns.org
    defaults:
      run:
        working-directory: deploy/prod
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Run playbook
        uses: dawidd6/action-ansible-playbook@v3
        with:
          playbook: deploy.yml
          directory: deploy/prod
          configuration: |
            [defaults]
            callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer
            stdout_callback = yaml
            nocows = false
            interpreter_python = /usr/bin/python
            [ssh_connection]
            retries=5
          vault_password: ${{ secrets.ANSIBLE_PASS }}
          inventory: ${{ vars.ANSIBLE_HOSTS }}
          options: |
            --inventory .hosts
            --limit ${{ vars.SERVER_GROUP }}
            --verbose
            --extra-vars "
            SPOTIPY_CLIENT_ID=${{ secrets.SPOTIPY_CLIENT_ID }}
            SPOTIPY_CLIENT_SECRET=${{ secrets.SPOTIPY_CLIENT_SECRET }}
            SPOTIPY_REDIRECT_URL=${{ vars.SPOTIPY_REDIRECT_URL }}
            API_LOGIN=${{ secrets.API_LOGIN }}
            API_PASSWORD=${{ secrets.API_PASSWORD }}
            PORT=${{ vars.PORT }}
            TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}
            "
